# Perfil usado pelos testes (@ActiveProfiles("test")): grava em um banco SQLite separado,
# dentro de target/, para que os testes não alterem o banco_financeiro.db do projeto.
spring.datasource.url=jdbc:sqlite:target/banco_financeiro_test.db
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
